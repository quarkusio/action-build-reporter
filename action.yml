name: 'Build Reporter'
description: 'Report build information in workflow summary'
inputs:
  github-token:
    description: 'GitHub token'
    required: true
  build-reports-artifacts-path:
    description: 'Path where to find build reports'
    required: false
  forks-only:
    description: 'Whether the report should be added for forks only'
    required: false
  develocity-url:
    description: 'The URL of the Develocity instance'
    required: false
runs:
  using: "composite"
  steps:
    - name: Inject quarkus-github-action repository credentials
      shell: bash
      run: |
        if [ -f ~/.m2/settings.xml ]; then
          if ! grep -q '<id>quarkus-github-action</id>' ~/.m2/settings.xml; then
            yq -p xml -o xml -i '.settings.servers.server |= (. | [.] + [{"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN}"}])' ~/.m2/settings.xml
          fi
        else
          mkdir -p ~/.m2/
          yq -p xml -o xml -n '.settings.servers.server = {"id": "quarkus-github-action", "username": "${env.GITHUB_ACTOR}", "password": "${env.GITHUB_TOKEN}"}' > ~/.m2/settings.xml
        fi
    - name: Set up Java 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '25'
        set-default: false
    - name: Set up JBang
      uses: jbangdev/setup-jbang@main
    - run: |
        if [[ -n "${JAVA_HOME_25_X64}" ]]; then
          echo "Installing ${JAVA_HOME_25_X64} as JDK 25 for JBang"
          jbang --verbose jdk install java-25 ${JAVA_HOME_25_X64}
        fi
        jbang --java 25 --fresh --repos 'quarkus-github-action=https://maven.pkg.github.com/quarkusio/action-build-reporter/' --repos 'mavencentral' io.quarkus.bot:action-build-reporter:999-SNAPSHOT
      shell: bash
      env:
        JSON_INPUTS: ${{ toJSON(inputs) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
